# general
event:
  name: isolet
  start: "1739145600" # unix timestamp in seconds
  end: "1741564800" # unix timestamp in seconds
  postEvent: false
  publicURL: https://isolet.dev
  teamSize: 4 # max number of users in a team
  allowedDomains: 
    - gmail.com
    - yahoo.com
    - hotmail.com
    - outlook.com
    - protonmail.com
  
  environment: "production" # to determine the certificate server. use "production" for production environment
  userRegistration: true # whether to allow user registration (usually for dev environment)
  emailVerification: true # whether to send verification email to user (usually for dev environment)
  passwordReset: true # whether to allow password reset (usually for dev environment)


# platform unit
platform:
  database:
    enabled: true
    image: postgres
    version: 18
    name: isolet
    storageClass: standard # check with the cloud provider for the a persistent storage class
    capacity: 2Gi
    maxOpenConnections: 30
    maxIdleConnections: 30
    maxConnectionLifetime: 3600s

  fileserver: # fileserver
    image: docker.io/thealpha16/phoros
    version: 1.1.0
    storageClass: standard
    capacity: 3Gi
    objectStore: 
      type: native
  
  api:
    image: docker.io/thealpha16/isolet-api
    version: 2.0.0
    
    sentry:
      sampleRate: 1.0
      traceSampleRate: 0.05
    
    token:
      maxSessionsPerUser: 5 # maximum number of active sessions per user, set to 0 for unlimited
      maxPasswordResetSessions: 1 # maximum number of active password reset sessions, set to 0 for unlimited
      emailVerificationValidity: 10m
      authValidity: 24h
      passwordResetValidity: 30m
      teamInviteValidity: 1h

    smtp:
      sender: noreply@isolet.dev
      retries: 3
      timeout: 10s
      channelSize: 10

    configVars:
      refreshInterval: 10m # interval to refresh config vars from database

  ui:
    image: docker.io/thealpha16/isolet-ui
    version: 2.0.2

  proxy:
    image: docker.io/thealpha16/isolet-proxy
    version: 2.0.0

  socky:
    image: docker.io/thealpha16/isolet-socky
    version: 1.2.0

  valkey:
    address: valkey://valkey-svc:6379
    useTLS: false

# isolated challenges unit
isolet:
  namespace: isolet

  concurrentInstances: 2
  defaultCPU: 15m
  defaultMemory: 32Mi
  limitCPU: 50m
  limitMemory: 128Mi
  defaultInstanceTime: 30m

registry:
  type: private
  url: asia-south1-docker.pkg.dev/greek-proxy-814691-q2/isolet-dev # if you are using external registry, then provide the url here

# automation task unit
automation:
  namespace: automation

  tide:
    image: isolet-tide
    version: 1.0.0

# admin unit
admin:
  namespace: admin

