# Global settings
global:
  imagePullPolicy: Always

# Event settings
event:
  name: isolet
  publicURL: https://isolet.dev
  domain: isolet.dev
  start: "1739145600"  # unix timestamp
  end: "1741564800"    # unix timestamp
  postEvent: false
  teamSize: 4
  allowedDomains:
    - gmail.com
    - yahoo.com
    - hotmail.com
    - outlook.com
    - protonmail.com
  registration:
    users: true
    emailVerification: true
    passwordReset: true

# Oracle — REST API + Kafka consumer (two deployments, same image)
oracle:
  image: docker.io/thealpha16/isolet-oracle
  version: "2.0.0"
  replicas: 2          # oracle-rest
  consumerReplicas: 1  # oracle-consumer
  token:
    maxSessionsPerUser: 5
    maxPasswordResetSessions: 1
    emailVerificationValidity: "10m"
    authValidity: "24h"
    realtimeValidity: "1h"
    passwordResetValidity: "30m"
    teamInviteValidity: "1h"
  smtp:
    sender: noreply@isolet.dev
    retries: 3
    timeout: "10s"
    channelSize: 10
  kafka:
    brokers: "kafka-svc:9092"
    groupId: "oracle"
  sentry:
    sampleRate: 1.0
    traceSampleRate: 0.05
  configVars:
    refreshInterval: "10m"

# Pulse — Elixir/Phoenix WebSocket gateway
pulse:
  image: docker.io/thealpha16/isolet-pulse
  version: "1.2.0"
  replicas: 1
  kafka:
    brokers: "kafka-svc:9092"
    topic: "herald.notifications"
    groupId: "pulse"
    clientId: "pulse"

# Herald — Go event emitter (k8s_source and postgres_source modes)
herald:
  image: docker.io/thealpha16/isolet-herald
  version: "1.0.0"
  k8sSource:
    enabled: true
    namespaces: "isolet,dynamic"
    dedupeWindow: "60s"
  postgresSource:
    enabled: true
  kafka:
    brokers: "kafka-svc:9092"
    retries: 3
  emitter:
    retries: 5
    retryInterval: "1s"

# UI — Next.js frontend
ui:
  image: docker.io/thealpha16/isolet-ui
  version: "v2.0.5"
  replicas: 1

# Proxy — Nginx reverse proxy
proxy:
  image: docker.io/thealpha16/isolet-proxy
  version: "2.0.0"
  replicas: 1

# Phoros — challenge file server
phoros:
  image: docker.io/thealpha16/phoros
  version: "1.1.0"
  storageClass: standard
  capacity: 3Gi
  objectStore:
    type: native

# Valkey — Redis-compatible cache and pub/sub
valkey:
  address: "valkey://valkey-svc:6379"
  useTLS: false

# PostgreSQL — optional managed database
database:
  enabled: false
  image: postgres
  version: "18"
  name: isolet
  storageClass: standard
  capacity: 2Gi

# PGBouncer — connection pooler
pgbouncer:
  maxOpenConnections: 30
  maxIdleConnections: 30
  maxConnectionLifetime: "3600s"

# Instance configuration — used by oracle and for namespace references
instances:
  namespaces:
    onDemand: isolet
    dynamic: dynamic
  resources:
    requests:
      cpu: "15m"
      memory: "32Mi"
    limits:
      cpu: "50m"
      memory: "128Mi"
  lifetime:
    default: "30m"
    max: "24h"
  maxConcurrent: 2
  timeouts:
    start: "5m"
    stop: "2m"
    extend: "1m"

# Tide operator API group — tide is deployed separately; this configures oracle + RBAC
tide:
  apiVersion: "challenges.isolet.dev/v1"

# Traefik — set enabled: false if Traefik is already installed in the cluster
traefik:
  enabled: true

# TLS — set enabled: false to skip cert-manager Certificate and copy Job
tls:
  enabled: true

# cert-manager — Let's Encrypt TLS
certManager:
  dnsProvider: cloudflare
  email: ""
  environment: "dev"  # use "production" for Let's Encrypt production certs

# external-dns
externalDns:
  enabled: true

# Container registry
registry:
  type: public  # "public" or "private"
  url: ""       # required for private registries

# Initial admin users (optional, empty by default)
users: []

# Secrets — all values must be base64-encoded
## PLEASE DO NOT USE DEFAULT VALUES IN PRODUCTION
secrets:
  signing:
    token: ""      # TOKEN_SIGNING_KEY (oracle) = JWT_SECRET (pulse)
    instance: ""   # INSTANCE_SECRET_KEY (oracle)

  dns:
    token: ""      # Cloudflare DNS API token

  smtp:
    host: ""
    port: ""
    user: ""
    password: ""

  database:
    user: ""
    password: ""
    host: ""
    port: ""

  sentry:
    dsn: ""        # optional; leave empty to disable

  valkey:
    username: ""   # optional
    password: ""   # optional; leave empty if Valkey has no auth

  pulse:
    secretKeyBase: ""  # PHX SECRET_KEY_BASE — generate with: mix phx.gen.secret

  herald:
    postgresDSN: ""            # POSTGRES_DSN (postgres_source mode)
    postgresReplicationDSN: "" # POSTGRES_REPLICATION_DSN (postgres_source mode)

  registry:
    dockerconfig: ""  # base64-encoded docker config JSON (required for private registry)
