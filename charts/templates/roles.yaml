---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: isolet-manager
  namespace: {{ .Values.isolet.namespace }}
  labels:
    app.kubernetes.io/component: role
    app.kubernetes.io/part-of: isolet
    {{- include "charts.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - isolet.dev
    resources:
    - instances
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-reader
  namespace: cert-manager
  labels:
    app.kubernetes.io/component: role
    app.kubernetes.io/part-of: cert-manager
    {{- include "charts.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - cert-manager.io
    resources:
    - certificates
    verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: isolet-cert-copier
  namespace: {{ .Values.isolet.namespace }}
  labels:
    app.kubernetes.io/component: role
    app.kubernetes.io/part-of: isolet
    {{- include "charts.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dynamic-cert-copier
  namespace: {{ .Values.dynamic.namespace }}
  labels:
    app.kubernetes.io/component: role
    app.kubernetes.io/part-of: dynamic
    {{- include "charts.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-secret-reader
  namespace: cert-manager
  labels:
    app.kubernetes.io/component: role
    app.kubernetes.io/part-of: cert-manager
    {{- include "charts.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
