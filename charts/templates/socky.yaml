---
apiVersion: apps/v1
kind: Deployment
metadata:
	name: socky-deployment
	namespace: {{ .Values.platform.namespace }}
	labels:
		app.kubernetes.io/component: deployment
		app.kubernetes.io/part-of: socky
		{{- include "charts.labels" . | nindent 4 }}
spec:
	replicas: 1
	selector:
		matchLabels:
			app.kubernetes.io/component: deployment
			app.kubernetes.io/part-of: socky
	template:
		metadata:
			name: socky-deployment
			labels:
				app.kubernetes.io/component: deployment
				app.kubernetes.io/part-of: socky
		spec:
			containers:
				- name: socky
					image: "{{ .Values.platform.socky.image }}:{{ .Values.platform.socky.version | default "latest" }}"
					imagePullPolicy: Always
					resources:
						limits:
							memory: "1Gi"
							cpu: "300m"
						requests:
							memory: "128Mi"
							cpu: "30m"
					ports:
						- containerPort: 8888
					env:
						- name: POSTGRES_PASSWORD
							valueFrom:
								secretKeyRef:
									name: api-secrets
									key: DB_PASSWORD

						- name: POSTGRES_USER
							valueFrom:
								secretKeyRef:
									name: api-secrets
									key: DB_USER

						- name: POSTGRES_HOST
							valueFrom:
								configMapKeyRef:
									name: api-config
									key: DB_HOST

						- name: POSTGRES_DATABASE
							valueFrom:
								configMapKeyRef:
									name: api-config
									key: DB_NAME

						- name: SESSION_SECRET
							valueFrom:
								secretKeyRef:
									name: api-secrets
									key: TOKEN_SIGNING_KEY
					livenessProbe:
						httpGet:
							path: /ping
							port: 8888
						initialDelaySeconds: 40
						failureThreshold: 5
						periodSeconds: 10
					startupProbe:
						httpGet:
							path: /ping
							port: 8888
						failureThreshold: 30
						periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
	name: socky-svc
	namespace: {{ .Values.platform.namespace }}
	labels:
		app.kubernetes.io/component: service
		app.kubernetes.io/part-of: socky
		{{- include "charts.labels" . | nindent 4 }}
spec:
	ports:
		- port: 80
			targetPort: 8888
	selector:
		app.kubernetes.io/component: deployment
		app.kubernetes.io/part-of: socky

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
	name: socky-hpa
	namespace: {{ .Values.platform.namespace }}
	labels:
		app.kubernetes.io/component: hpa
		app.kubernetes.io/part-of: socky
		{{- include "charts.labels" . | nindent 4 }}
spec:
	scaleTargetRef:
		apiVersion: apps/v1
		kind: Deployment
		name: socky-deployment
	minReplicas: 1
	maxReplicas: 4
	metrics:
		- type: Resource
			resource:
				name: cpu
				target:
					type: Utilization
					averageUtilization: 90
		- type: Resource
			resource:
				name: memory
				target:
					type: Utilization
					averageUtilization: 80
