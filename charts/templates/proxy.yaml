---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-deployment
  namespace: platform
  labels: 
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: proxy
    {{- include "charts.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: deployment
      app.kubernetes.io/part-of: proxy
  template:
    metadata:
      name: proxy-deployment
      labels:
        app.kubernetes.io/component: deployment
        app.kubernetes.io/part-of: proxy
    spec:
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image }}:{{ .Values.proxy.version | default "latest" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
          resources:
            limits:
              memory: "256Mi"
              cpu: "300m"
            requests:
              memory: "32Mi"
              cpu: "10m"
          ports:
            - containerPort: 80
          env:
            - name: PROXY_SERVER_NAME
              value: {{ .Values.event.domain }}
            - name: UI_URL
              value: ui-svc
            - name: API_URL
              value: oracle-svc
            - name: PULSE_URL
              value: pulse-svc
            - name: PHOROS_URL
              value: fileserver-svc

---
apiVersion: v1
kind: Service
metadata:
  name: proxy-svc
  namespace: platform
  labels: 
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: proxy
    {{- include "charts.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.event.domain }}
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  type: LoadBalancer
  ports:
    - port: 80
  selector:
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: proxy

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proxy-hpa
  namespace: platform
  labels: 
    app.kubernetes.io/component: hpa
    app.kubernetes.io/part-of: proxy
    {{- include "charts.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proxy-deployment
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90 
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80 