---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-deployment
  namespace: platform
  labels: 
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: api
    {{- include "charts.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: deployment
      app.kubernetes.io/part-of: api
  template:
    metadata:
      name: oracle-deployment
      labels:
        app.kubernetes.io/component: deployment
        app.kubernetes.io/part-of: api
    spec:
      serviceAccountName: oracle-service-account
      containers:
        - name: api
          image: "{{ .Values.platform.api.image }}:{{ .Values.platform.api.version }}"
          imagePullPolicy: Always
          resources:
            limits:
              memory: "128Mi"
              cpu: "300m"
            requests:
              memory: "32Mi"
              cpu: "50m"
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: oracle-config
            - secretRef:
                name: oracle-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: oracle-svc
  namespace: platform
  labels: 
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: api
    {{- include "charts.labels" . | nindent 4 }}
spec:
  ports:
    - port: 80
  selector:
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oracle-hpa
  namespace: platform
  labels: 
    app.kubernetes.io/component: hpa
    app.kubernetes.io/part-of: api
    {{- include "charts.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oracle-deployment
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80 
