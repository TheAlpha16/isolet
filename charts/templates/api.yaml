---
# oracle-rest — handles HTTP traffic (IDENTITY=rest, set in oracle-config)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-rest
  namespace: platform
  labels:
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: api
    app.kubernetes.io/instance: rest
    {{- include "charts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.oracle.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: deployment
      app.kubernetes.io/part-of: api
      app.kubernetes.io/instance: rest
  template:
    metadata:
      labels:
        app.kubernetes.io/component: deployment
        app.kubernetes.io/part-of: api
        app.kubernetes.io/instance: rest
    spec:
      serviceAccountName: oracle-service-account
      containers:
        - name: api
          image: "{{ .Values.oracle.image }}:{{ .Values.oracle.version }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "50m"
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: oracle-config
            - secretRef:
                name: oracle-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3

---
# oracle-consumer — Kafka consumer mode (overrides IDENTITY from ConfigMap)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-consumer
  namespace: platform
  labels:
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: api
    app.kubernetes.io/instance: consumer
    {{- include "charts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.oracle.consumerReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: deployment
      app.kubernetes.io/part-of: api
      app.kubernetes.io/instance: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: deployment
        app.kubernetes.io/part-of: api
        app.kubernetes.io/instance: consumer
    spec:
      serviceAccountName: oracle-service-account
      containers:
        - name: api
          image: "{{ .Values.oracle.image }}:{{ .Values.oracle.version }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
          resources:
            limits:
              memory: "256Mi"
              cpu: "300m"
            requests:
              memory: "64Mi"
              cpu: "30m"
          env:
            - name: IDENTITY
              value: consumer
          envFrom:
            - configMapRef:
                name: oracle-config
            - secretRef:
                name: oracle-secrets
          startupProbe:
            exec:
              command: ["sh", "-c", "true"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: oracle-svc
  namespace: platform
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: api
    {{- include "charts.labels" . | nindent 4 }}
spec:
  ports:
    - port: 80
  selector:
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: api
    app.kubernetes.io/instance: rest

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oracle-hpa
  namespace: platform
  labels:
    app.kubernetes.io/component: hpa
    app.kubernetes.io/part-of: api
    {{- include "charts.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oracle-rest
  minReplicas: {{ .Values.oracle.replicas }}
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
