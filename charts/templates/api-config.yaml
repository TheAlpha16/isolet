apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-config
  namespace: platform
  labels: 
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: api
    {{- include "charts.labels" . | nindent 4 }}
data:
  # Application
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "prod"
  VERSION: {{ .Values.platform.api.version | quote }}

  # Database
  DB_NAME: {{ .Values.platform.database.name }}
  DB_HOST: "pgbouncer-svc"
  DB_PORT: "5432"
  DB_MAX_OPEN_CONNECTIONS: {{ .Values.platform.database.maxOpenConnections | quote }}
  DB_MAX_IDLE_CONNECTIONS: {{ .Values.platform.database.maxIdleConnections | quote }}
  DB_MAX_CONNECTION_LIFETIME: {{ .Values.platform.database.maxConnectionLifetime | quote }}

  # Sentry
  SENTRY_SAMPLE_RATE: {{ .Values.platform.api.sentry.sampleRate | quote }}
  SENTRY_TRACE_SAMPLE_RATE: {{ .Values.platform.api.sentry.traceSampleRate | quote }}

  # Valkey/Redis
  VALKEY_ADDRESS: {{ .Values.platform.valkey.address }}
  VALKEY_USE_TLS: {{ .Values.platform.valkey.useTLS | quote }}

  # Token Configuration
  TOKEN_EMAIL_VERIFICATION_VALIDITY: {{ .Values.platform.api.token.emailVerificationValidity }}
  TOKEN_AUTH_VALIDITY: {{ .Values.platform.api.token.authValidity }}
  TOKEN_PASSWORD_RESET_VALIDITY: {{ .Values.platform.api.token.passwordResetValidity }}
  TOKEN_TEAM_INVITE_VALIDITY: {{ .Values.platform.api.token.teamInviteValidity }}

  # Config Vars
  CONFIG_VARS_REFRESH_INTERVAL: {{ .Values.platform.api.configVars.refreshInterval }}

  # SMTP
  SMTP_RETRIES: {{ .Values.platform.api.smtp.retries | quote }}
  SMTP_TIMEOUT: {{ .Values.platform.api.smtp.timeout }}
  SMTP_CHANNEL_SIZE: {{ .Values.platform.api.smtp.channelSize | quote }}

  INSTANCE_LIFETIME: {{ .Values.isolet.defaultInstanceTime }}
