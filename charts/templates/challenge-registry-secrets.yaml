{{- if eq .Values.registry.type "private" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: challenge-registry-secret
  namespace: dynamic
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: dynamic
    {{- include "charts.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ .Values.secrets.registry.dockerconfig }}

---
apiVersion: v1
kind: Secret
metadata:
  name: challenge-registry-secret
  namespace: isolet
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: isolet
    {{- include "charts.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ .Values.secrets.registry.dockerconfig }}

{{ end }}
