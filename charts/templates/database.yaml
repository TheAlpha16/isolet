{{- if eq .Values.database.enabled true -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: platform
  labels: 
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: database
    {{- include "charts.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: deployment
      app.kubernetes.io/part-of: database
  template:
    metadata:
      name: database-deployment
      labels:
        app.kubernetes.io/component: deployment
        app.kubernetes.io/part-of: database
    spec:
      containers:
        - name: postgres-database
          image: "{{ .Values.database.image }}:{{ .Values.database.version | default "latest" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
          resources:
            limits:
              memory: "2Gi"
              cpu: "5000m"
            requests:
              memory: "500Mi"
              cpu: "2000m"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oracle-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oracle-secrets
                  key: DB_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: oracle-config
                  key: DB_NAME
          ports:
            - name: db-container
              containerPort: 5432
          volumeMounts:
            - name: db-pv
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "pg_ctl -D /var/lib/postgresql/data -w -t 60 -m fast stop"]
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.secrets.database.user | b64dec }} -d {{ .Values.database.name }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.secrets.database.user | b64dec }} -d {{ .Values.database.name }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: db-pv
          persistentVolumeClaim:
            claimName: db-pv-claim

---
apiVersion: v1
kind: Service
metadata:
  name: database-svc
  namespace: platform
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: database
    {{- include "charts.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      protocol: TCP
      name: postgres-database
  selector:
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: database

{{- end -}}