---
# Secrets for herald-k8s (k8s_source mode) — Valkey auth + Sentry
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: herald-k8s-secrets
  namespace: platform
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: herald
    app.kubernetes.io/instance: k8s
    {{- include "charts.labels" . | nindent 4 }}
data:
  VALKEY_PASSWORD: {{ .Values.secrets.valkey.password }}
  SENTRY_DSN: {{ .Values.secrets.sentry.dsn }}

---
# Secrets for herald-postgres (postgres_source mode) — DSNs + Sentry
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: herald-postgres-secrets
  namespace: platform
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: herald
    app.kubernetes.io/instance: postgres
    {{- include "charts.labels" . | nindent 4 }}
data:
  POSTGRES_DSN: {{ .Values.secrets.herald.postgresDSN }}
  POSTGRES_REPLICATION_DSN: {{ .Values.secrets.herald.postgresReplicationDSN }}
  SENTRY_DSN: {{ .Values.secrets.sentry.dsn }}
