apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: instances.isolet.dev
spec:
  group: isolet.dev
  names:
    kind: Instance
    plural: instances
    singular: instance
    shortNames: [inst]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                challengeRef:
                  type: object
                  properties:
                    id:
                      type: string   # id of the challenge
                    name:
                      type: string   # dns-safe slug derived from challenge name
                    flag:
                      type: string  # flag (optional, can be empty) will be injected as env variable
                    type:
                      type: string   # dynamic | on-demand
                      enum: ["dynamic", "on-demand"]
                teamId:
                  type: integer       # team id (required for on-demand, optional for dynamic)
                image:
                  type: string        # container image to run
                resources:
                  type: object        # requests/limits for cpu/mem
                  additionalProperties: true
                networking:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string   # endpoint name (e.g., "app", "metrics")
                      protocol:
                        type: string   # http, tcp, ssh, nc, etc.
                      hostname:
                        type: string   # desired fqdn (controller can generate if empty)
                      port:
                        type: integer  # service port
                lifecycle:
                  type: object
                  properties:
                    availableAt:
                      type: string   # (optional) RFC3339 timestamp of the time when the instance should be available
                    expiresAt:
                      type: string   # (optional) RFC3339 timestamp of the time when the instance should be terminated
                    allowExtension:
                      type: boolean  # allow extension of expiry time (default: true)
                      default: true
                    restartPolicy:
                      type: string   # Always/Never/OnFailure
                      enum: ["Always", "Never", "OnFailure"]
                      default: "Never"
            status:
              type: object
              properties:
                phase:
                  type: string  # Pending | Staged | Running | Failed
                endpoints:
                  type: array  # resolved endpoints
                  items:
                    type: object
                    properties:
                      name:
                        type: string   # endpoint name (e.g., "app", "metrics")
                      protocol:
                        type: string   # http, tcp, ssh, nc, etc.
                      hostname:
                        type: string   # resolved fqdn
                      port:
                        type: integer  # service port
                      ready:
                        type: boolean  # whether the endpoint is ready
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
      selectableFields:
        - jsonPath: .spec.challengeRef.id
        - jsonPath: .spec.challengeRef.type
        - jsonPath: .spec.teamId
        - jsonPath: .status.phase
      additionalPrinterColumns:
        - name: Challenge
          type: string
          jsonPath: .spec.challengeRef.name
          description: Name of the challenge
        - name: Type
          type: string
          jsonPath: .spec.challengeRef.type
          description: Challenge type (dynamic/on-demand)
        - name: Team
          type: string
          jsonPath: .spec.teamId
          description: Team ID
        - name: Expiry
          type: date
          jsonPath: .spec.lifecycle.expiresAt
          description: Expiry time of the instance

          