                      - http
                      - https
                      - nc
                      - ssh
                      type: string
                    ready:
                      description: Ready indicates whether the endpoint is ready to
                        accept traffic
                      type: boolean
                    targetPort:
                      description: |-
                        TargetPort of the endpoint
                        Port on which the application inside the container is listening
                      format: int32
                      type: integer
                  required:
                  - protocol
                  - targetPort
                  type: object
                type: array
              lifecycle:
                description: lifecycle defines the lifecycle configuration for the
                  instance
                properties:
                  allowExtension:
                    default: true
                    description: |-
                      allowExtension indicates whether the instance's expiry time can be extended by the user
                      Default is true
                    type: boolean
                  availableAt:
                    description: |-
                      timestamp of the time when the instance should be available
                      If not set, the instance will be available immediately after provisioning
                    format: date-time
                    type: string
                  expiresAt:
                    description: |-
                      timestamp of the time when the instance should be terminated
                      If not set, the instance will run indefinitely until manually terminated
                    format: date-time
                    type: string
                  restartPolicy:
                    default: Never
                    description: |-
                      restartPolicy defines the restart policy for all containers within the instance
                      One of Always, OnFailure, Never
                      Default is Never
                    type: string
                type: object
              limits:
                additionalProperties:
                  anyOf:
