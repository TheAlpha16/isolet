                    - on-demand
                    type: string
                required:
                - id
                - image
                - name
                - type
                type: object
              endpoints:
                description: Endpoints represents the network endpoints for the instance
                items:
                  description: Endpoint represents a network endpoint for an instance
                  properties:
                    hostname:
                      description: |-
                        Hostname of the endpoint
                        Controller genarates a DNS-safe hostname if not provided
                        e.g., <instance-uuid>.<challenge-name>.<tide-domain>

                        Example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890.alices-adventure.isolet.dev"
                      type: string
                    name:
                      description: Name of the endpoint (e.g., "app", "metrics")
                      type: string
                    port:
                      description: |-
                        Port of the endpoint
