          metadata:
            type: object
          spec:
            description: spec defines the desired state of Instance
            properties:
              challenge:
                description: challenge is the challenge for which this instance is
                  created
                properties:
                  flag:
                    description: |-
                      A custom and unique flag can be passed per instance
                      If set, it will be injected as an environment variable into the container
                    type: string
                  id:
                    description: ID of the challenge
                    format: int64
                    minimum: 1
                    type: integer
                  image:
