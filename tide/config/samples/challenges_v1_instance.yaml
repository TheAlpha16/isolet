apiVersion: challenges.isolet.dev/v1
kind: Instance
metadata:
  labels:
    app.kubernetes.io/name: tide
    app.kubernetes.io/managed-by: kustomize
  name: sample-instance
spec:
  challenge:
    id: 1
    name: nginx-server
    image: nginx:latest
    type: on-demand
  team:
    id: 1
  endpoints:
  - name: web
    targetPort: 80
    protocol: http
  - name: websecure
    targetPort: 443
    protocol: https
  limits:
    cpu: "100m"
    memory: "128Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"
