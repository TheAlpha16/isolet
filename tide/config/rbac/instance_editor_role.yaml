# This rule is not used by the project tide itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the challenges.isolet.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tide
    app.kubernetes.io/managed-by: kustomize
  name: instance-editor-role
rules:
- apiGroups:
  - challenges.isolet.dev
  resources:
  - instances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - challenges.isolet.dev
  resources:
  - instances/status
  verbs:
  - get
